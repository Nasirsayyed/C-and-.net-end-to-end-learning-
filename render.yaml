# Render Blueprint — deploys the Todo API (Project 3) as a free web service.
# See 40-Projects/03-TodoApi/README.md for the full "Deploy to Render" walkthrough.
#
# To use: push this repo to GitHub, then in Render: New -> Blueprint -> select
# this repo. Render reads this file automatically and provisions the service.
services:
  - type: web
    name: dotnet-todo-api
    runtime: docker
    plan: free
    dockerfilePath: ./40-Projects/03-TodoApi/Dockerfile
    dockerContext: ./40-Projects/03-TodoApi
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Development # keeps Swagger UI enabled on the deployed demo — see that project's Program.cs
    healthCheckPath: /api/todos
